
name: Build and Release PATARI

on:
  push:
    tags:
      - 'v*' #  workflow will  run on tag starting with 'v' (e.g., v0.2)

jobs:
  build-pyapp:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write 

    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            binary_path: target/release/pyapp.exe
            ext: .exe
          - os: macos-latest
            os_name: macos
            binary_path: target/release/pyapp
            ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PATARI Wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download PyApp Source
        shell: bash
        run: |
          curl -L https://github.com/ofek/pyapp/releases/latest/download/source.tar.gz -o pyapp-source.tar.gz
          tar -xzf pyapp-source.tar.gz
          mv pyapp-v* pyapp-source

      - name: Build PyApp Wrapper
        shell: bash
        env:
          PYAPP_PROJECT_NAME: "patari"
          PYAPP_EXEC_SPEC: "patari.launcher:main"
          PYAPP_PYTHON_VERSION: "3.12"
          PYAPP_PIP_EXTRA_ARGS: "napari[all]"
        run: |
          export PYAPP_PROJECT_PATH=$(ls dist/patari-*.whl | head -n 1)
          cd pyapp-source
          export PYAPP_PROJECT_PATH="../$PYAPP_PROJECT_PATH"
          cargo build --release

      # Rename the file using the Git Tag (github.ref_name)
      - name: Rename Executable for Release
        shell: bash
        run: |
          # This creates e.g., patari_v0.2_windows.exe
          mv pyapp-source/${{ matrix.binary_path }} patari_${{ github.ref_name }}_${{ matrix.os_name }}${{ matrix.ext }}

      - name: Prepare Release Package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_package"
          mv "$GITHUB_WORKSPACE/pyapp-source/${{ matrix.binary_path }}" "$GITHUB_WORKSPACE/release_package/patari${{ matrix.ext }}"
          cp "$GITHUB_WORKSPACE/docs/PATARI_Instructions.pdf" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/docs/PATARI_Shortcuts.pdf" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/scripts/UNINSTALL_MACOS.txt" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/scripts/UNINSTALL_WINDOWS.bat" "$GITHUB_WORKSPACE/release_package/" || true
          cd "$GITHUB_WORKSPACE/release_package" && zip -r "../patari_${{ github.ref_name }}_${{ matrix.os_name }}.zip" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: patari_${{ github.ref_name }}_${{ matrix.os_name }}.zip
          generate_release_notes: true