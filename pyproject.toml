[project]
name = "optari"
dynamic = ["version"]
description = "Analysis tool for clinical photoacoustic/optoacoustic studies based on PATATO and napari"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Moritz Schillinger"},
  {email = "moritz.schillinger@fau.de"},
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
# the PATATO wheels below are built for CPython 3.12 only
requires-python = ">=3.12,<3.13"
dependencies = [
    "napari==0.9.1",
    "PySide6==6.11.2",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "magicgui==0.10.2",
    "qtpy==2.4.3",
    "imageio==2.37.4",
    "pyqtgraph==0.14.0",
    "scikit-image==0.26.0",
    "scipy==1.18.1",
    "h5py==3.16.0",
    "opencv-python-headless==5.0.0.93",
    "onnxruntime==1.28.0 ; sys_platform != 'linux'",
    "onnxruntime-gpu==1.28.0 ; sys_platform == 'linux'",
    "jax[cpu]==0.11.2",
    "pacfish==0.4.4",
    "openpyxl==3.1.5",
    "requests==2.34.2",
    "patato @ https://github.com/Mo-Sc/patato/releases/download/optari-v0.8.4/patato-0.7.1.dev1+ge81cfa3a5-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
    "patato @ https://github.com/Mo-Sc/patato/releases/download/optari-v0.8.4/patato-0.7.1.dev1+ge81cfa3a5-cp312-cp312-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "patato @ https://github.com/Mo-Sc/patato/releases/download/optari-v0.8.4/patato-0.7.1.dev1+ge81cfa3a5-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "black>=26.5",
]

[project.gui-scripts]
optari = "optari.launcher:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optari" = ["config/default_configs/*.json", "config/default_configs/**/*.json", "config/startup.png", "config/logo.png"]

[tool.setuptools_scm]
write_to = "src/optari/_version.py"
fallback_version = "0.0.1+nogit"
# Keeps dev builds versions short
local_scheme = "no-local-version"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
log_cli_level = "INFO"
testpaths = ["tests"]
filterwarnings = [
    # caused by napari
    "ignore:`json_encoders` is deprecated:DeprecationWarning",
]

[tool.black]
line-length = 79
target-version = ['py312']