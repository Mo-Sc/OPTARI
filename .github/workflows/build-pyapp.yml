name: Build PATARI Binaries

on:
  push:

jobs:
  build-pyapp:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            zip_name: patari-windows
            exe_name: patari.exe
            binary_path: target/release/pyapp.exe
          - os: macos-latest
            zip_name: patari-macos
            exe_name: patari
            binary_path: target/release/pyapp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PATARI Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download PyApp Source
        shell: bash
        run: |
          curl -L https://github.com/ofek/pyapp/releases/latest/download/source.tar.gz -o pyapp-source.tar.gz
          tar -xzf pyapp-source.tar.gz
          mv pyapp-v* pyapp-source

      - name: Build PyApp Wrapper
        shell: bash
        env:
          PYAPP_PROJECT_NAME: "patari"
          PYAPP_EXEC_SPEC: "patari.launcher:main"
          PYAPP_PYTHON_VERSION: "3.12"
          PYAPP_PIP_EXTRA_ARGS: "napari[all]"  # Todo: better here or using optional-dependencies in pyproject.toml? 
        run: |
          # Find the built wheel file dynamically
          export PYAPP_PROJECT_PATH=$(ls dist/patari-*.whl | head -n 1)
          
          # Move into the PyApp directory and compile
          cd pyapp-source
          # Use absolute path for the wheel
          export PYAPP_PROJECT_PATH="../$PYAPP_PROJECT_PATH"
          cargo build --release

      - name: Rename Executable
        shell: bash
        run: |
          mv pyapp-source/${{ matrix.binary_path }} pyapp-source/target/release/${{ matrix.exe_name }}
      - name: Prepare Release Package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_package"
          mv "$GITHUB_WORKSPACE/pyapp-source/target/release/${{ matrix.exe_name }}" "$GITHUB_WORKSPACE/release_package/"
          cp "$GITHUB_WORKSPACE/docs/PATARI_Instructions.pdf" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/docs/PATARI_Shortcuts.pdf" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/scripts/UNINSTALL_MACOS.txt" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/scripts/UNINSTALL_WINDOWS.bat" "$GITHUB_WORKSPACE/release_package/" || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: release_package/


