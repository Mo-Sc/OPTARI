name: Build OPTARI Binaries

on:
  push:
    tags:
      - 'v*' # Runs on release tags (e.g., v0.8.0)

jobs:
  build-pyapp:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            exe_suffix: .exe
            binary_path: target/release/pyapp.exe
            uninstall_file: UNINSTALL_WINDOWS.bat
          - os: macos-latest
            os_name: macos
            exe_suffix: ""
            binary_path: target/release/pyapp
            uninstall_file: UNINSTALL_MACOS.txt
          - os: ubuntu-22.04
            os_name: linux
            exe_suffix: ""
            binary_path: target/release/pyapp
            uninstall_file: UNINSTALL_LINUX.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build OPTARI Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download PyApp Source
        shell: bash
        run: |
          curl -L https://github.com/ofek/pyapp/releases/download/v0.29.0/source.tar.gz -o pyapp-source.tar.gz
          tar -xzf pyapp-source.tar.gz
          mv pyapp-v* pyapp-source

      - name: Build PyApp Wrapper
        shell: bash
        env:
          PYAPP_PROJECT_NAME: "optari"
          PYAPP_EXEC_SPEC: "optari.launcher:main"
          PYAPP_PYTHON_VERSION: "3.12"
          # Lets `<exe> self python`/`self python-path` show up in `<exe> self --help`.
          # Used to run figures/benchmark_pipeline.py on machines with only the binary
          # installed, against the exact interpreter/deps that ship in this build.
          PYAPP_EXPOSE_PYTHON: "true"
          PYAPP_EXPOSE_PYTHON_PATH: "true"
        run: |
          # Find the built wheel file dynamically
          export PYAPP_PROJECT_PATH=$(ls dist/optari-*.whl | head -n 1)
          
          # Move into the PyApp directory and compile
          cd pyapp-source
          export PYAPP_PROJECT_PATH="../$PYAPP_PROJECT_PATH"
          cargo build --release

      - name: Rename Executable with Version Tag
        shell: bash
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          VERSION_TAG="${VERSION_TAG//./-}"
          FINAL_NAME="optari-${VERSION_TAG}${{ matrix.exe_suffix }}"
          mv pyapp-source/${{ matrix.binary_path }} pyapp-source/target/release/$FINAL_NAME
          echo "FINAL_NAME=$FINAL_NAME" >> $GITHUB_ENV

      - name: Prepare Release Package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_package"
          mv "$GITHUB_WORKSPACE/pyapp-source/target/release/${{ env.FINAL_NAME }}" "$GITHUB_WORKSPACE/release_package/"
          cp "$GITHUB_WORKSPACE/docs/OPTARI_Instructions.pdf" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/docs/OPTARI_Shortcuts.pdf" "$GITHUB_WORKSPACE/release_package/" || true
          cp "$GITHUB_WORKSPACE/scripts/${{ matrix.uninstall_file }}" "$GITHUB_WORKSPACE/release_package/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optari-${{ matrix.os_name }}-${{ github.ref_name }}
          path: release_package/